<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profil Penjelajah - Lihat pencapaian dan statistikmu di Rimba Ajaib Pecahan.">
    <title>Rimba Pecahan - Profil Saya</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profil-panel { max-width: 600px; margin: 24px auto; text-align: center; }
        .big-avatar {
            width: 120px; height: 120px; border-radius: 50%; font-size: 4rem;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
            background: linear-gradient(135deg, #52b788, #74b9ff);
            border: 4px solid var(--sunny-yellow); box-shadow: 0 0 30px rgba(249,202,36,0.3);
            animation: breathe 4s ease-in-out infinite;
        }
        .p-name  { font-family: 'Baloo 2'; font-size: 2rem; font-weight: 900; color: var(--forest-mid); margin-bottom: 4px; }
        .p-class { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 14px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .stat-box {
            background: rgba(45,138,78,0.06); border: 1px solid rgba(45,138,78,0.2);
            border-radius: var(--radius-md); padding: 16px;
        }
        .stat-box .sv { font-family: 'Baloo 2'; font-size: 1.8rem; font-weight: 900; color: var(--forest-mid); }
        .stat-box .sl { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
        .badge-collection { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; }
        .badge-big {
            width: 52px; height: 52px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 1.8rem;
            background: rgba(249,202,36,0.1); border: 2px solid var(--sunny-yellow);
            box-shadow: 0 0 10px rgba(249,202,36,0.2);
        }
        .logout-link {
            color: #e74c3c; text-decoration: none; font-weight: 700; font-size: 0.95rem;
            display: inline-block; margin-top: 20px; transition: color 0.2s;
        }
        .logout-link:hover { color: #c0392b; }
    </style>
</head>
<body>
    <script src="js/script.js"></script>
    <script>
        renderTopNav('Profil Penjelajah', true, 'dashboard.html');
        const s = SpaceStore.get();
        const maxXP = SpaceStore.getXPForLevel(s.currentLevel);
        const accuracy = s.totalAnswered > 0 ? Math.round((s.totalCorrect/s.totalAnswered)*100) : 0;

        document.body.insertAdjacentHTML('beforeend', `
        <main class="page-container">
            <div class="glass-panel profil-panel">
                <div class="big-avatar">🦉</div>
                <div class="p-name">${s.username}</div>
                <div class="p-class">Kelas ${s.kelas}</div>
                <div class="rank-badge" style="display:inline-block;padding:5px 18px;border-radius:var(--radius-full);
                    background:linear-gradient(135deg,var(--forest-mid),var(--leaf-vivid));
                    color:white;font-weight:800;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px">
                    ${s.currentRank}
                </div>
                <div id="profilXP" style="margin-top:16px"></div>
                <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px">Level ${s.currentLevel} — ${s.totalXP}/${maxXP} XP</div>

                <div class="stat-grid">
                    <div class="stat-box"><div class="sv">${s.totalCorrect}</div><div class="sl">Jawaban Benar</div></div>
                    <div class="stat-box"><div class="sv">${s.totalAnswered}</div><div class="sl">Total Dijawab</div></div>
                    <div class="stat-box"><div class="sv">${accuracy}%</div><div class="sl">Akurasi</div></div>
                </div>

                <div style="font-weight:700;margin:16px 0 8px;font-size:1.1rem;color:var(--forest-mid)">🎖️ Koleksi Lencana</div>
                <div class="badge-collection">
                    ${s.collectedBadges.length > 0
                        ? s.collectedBadges.map(b => `<div class="badge-big">${b}</div>`).join('')
                        : '<p style="color:var(--text-secondary);font-size:0.9rem">Belum ada lencana. Selesaikan misi untuk mengumpulkan!</p>'}
                </div>

                <a href="index.html" class="logout-link" onclick="event.preventDefault();SpaceStore.resetAll();navigasiHalaman('index.html')">🚪 Keluar Akun (Logout)</a>
            </div>
        </main>`);
        renderXPBar('profilXP', s.totalXP, maxXP);
    </script>
</body>
</html>
