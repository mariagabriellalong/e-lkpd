<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catatan Hutan - Ceritakan pengalaman belajar pecahanmu hari ini.">
    <title>Rimba Pecahan - Catatan Hutan</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .refl-panel { max-width: 700px; margin: 24px auto; }
        .mood-grid { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
        .mood-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(45, 138, 78, 0.2);
            background: rgba(255,255,255,0.7); font-size: 2.2rem; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .mood-btn:hover { transform: scale(1.15); border-color: var(--sunny-yellow); background: rgba(255,255,255,0.9); }
        .mood-btn.selected { border-color: var(--sunny-yellow); background: rgba(249, 202, 36, 0.2);
            box-shadow: 0 0 15px rgba(249, 202, 36, 0.4); transform: scale(1.1); }
        .refl-textarea { width: 100%; min-height: 140px; border-radius: var(--radius-md);
            padding: 18px; font-size: 1.05rem; font-family: 'Nunito', sans-serif;
            border: 2px solid rgba(45, 138, 78, 0.3); background: rgba(255,255,255,0.85);
            color: var(--text-primary); resize: vertical; transition: all 0.3s ease; }
        .refl-textarea::placeholder { color: rgba(45, 138, 78, 0.5); }
        .refl-textarea:focus { outline: none; border-color: var(--forest-mid);
            box-shadow: 0 0 12px rgba(45, 138, 78, 0.2); background: rgba(255,255,255,0.95); }
        .past-refl { margin-top: 24px; }
        .refl-entry { background: rgba(255,255,255,0.7); border: 1px solid rgba(45, 138, 78, 0.2);
            border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; }
        .refl-entry .date { font-size: 0.8rem; color: var(--text-secondary); }
        .refl-entry .text { margin-top: 6px; font-size: 0.95rem; line-height: 1.5; color: var(--text-primary); }
    </style>
</head>
<body>
    <script src="js/script.js"></script>
    <script>
        renderTopNav('Catatan Hutan', true, 'dashboard.html');
        var s = SpaceStore.get();
        var selectedMood = '';

        document.body.insertAdjacentHTML('beforeend', `
        <main class="page-container">
            <div class="glass-panel refl-panel">
                <div class="section-heading">🌺 Catatan Hutan</div>
                <div class="section-subtitle">Bagaimana perasaanmu setelah belajar di hutan hari ini?</div>

                <div class="mood-grid">
                    <button class="mood-btn" data-mood="🤩" onclick="selectMood(this)" title="Senang Sekali">🤩</button>
                    <button class="mood-btn" data-mood="😊" onclick="selectMood(this)" title="Senang">😊</button>
                    <button class="mood-btn" data-mood="🤔" onclick="selectMood(this)" title="Biasa Saja">🤔</button>
                    <button class="mood-btn" data-mood="😔" onclick="selectMood(this)" title="Bingung">😔</button>
                </div>

                <form id="reflForm" onsubmit="submitRefl(event)">
                    <textarea class="refl-textarea" id="reflText" placeholder="Ceritakan petualanganmu hari ini... 😁" required></textarea>
                    <div style="text-align:center;margin-top:16px">
                        <button type="submit" class="btn-primary">Kirim Catatan 🌿</button>
                    </div>
                </form>

                <div class="past-refl" id="pastRefl"></div>
            </div>
        </main>`);

        function selectMood(btn) {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedMood = btn.dataset.mood;
            AudioManager.playClick();
        }

        function submitRefl(e) {
            e.preventDefault();
            const text = document.getElementById('reflText').value.trim();
            if (!text || !selectedMood) {
                alert('Pilih mood dan tulis ceritamu dulu ya! 😊');
                return;
            }
            SpaceStore.addReflection(text, selectedMood);
            SpaceStore.completeMission('mission4');
            SpaceStore.addBadge('🌺');
            AudioManager.playCorrect();
            document.getElementById('reflText').value = '';
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            selectedMood = '';
            renderPastReflections();

            // Tampilkan pesan sukses tanpa XP
            const overlay = document.createElement('div');
            overlay.className = 'celebration-overlay active';
            overlay.innerHTML = `
                <div style="font-size:4rem;margin-bottom:10px;">🌺</div>
                <div style="font-family:'Baloo 2',sans-serif;font-size:1.8rem;color:#fff;font-weight:800;margin-bottom:8px;">Catatan Tersimpan!</div>
                <div style="color:rgba(255,255,255,0.85);font-size:1.1rem;margin-bottom:24px;">Terima kasih sudah berbagi ceritamu hari ini 😊</div>
                <button class="btn-gold" id="reflClose">Kembali ke Peta Rimba 🗺️</button>
            `;
            document.body.appendChild(overlay);
            document.getElementById('reflClose').addEventListener('click', () => {
                overlay.remove();
                navigasiHalaman('dashboard.html');
            });
        }

        function renderPastReflections() {
            const el = document.getElementById('pastRefl');
            if (localStorage.getItem('isAdmin') !== 'true') { 
                el.innerHTML = ''; 
                return; 
            }
            const refs = SpaceStore.getAllReflections();
            if (refs.length === 0) { el.innerHTML = ''; return; }
            el.innerHTML = '<div style="font-weight:800;margin-bottom:10px;font-size:1.1rem;color:var(--forest-mid)">📝 Catatan Sebelumnya (Mode Admin)</div>' +
                refs.slice().reverse().map(r =>
                    `<div class="refl-entry"><div class="date">${r.mood} ${r.username || 'Anonim'} — ${new Date(r.date).toLocaleString('id-ID')}</div><div class="text">${r.text}</div></div>`
                ).join('');
        }
        renderPastReflections();
    </script>
</body>
</html>
