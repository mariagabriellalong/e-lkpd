<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tentang Kami - Tim pengembang eLKPD Rimba Pecahan.">
    <title>Rimba Pecahan - Tentang Kami</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Container Utama */
        .about-panel { max-width: 800px; margin: 30px auto; padding-top: 40px !important; }
        
        .section-heading { font-family: 'Baloo 2'; font-weight: 800; color: var(--forest-dark); text-shadow: 0 0 8px rgba(39, 174, 96, 0.25); }

        /* ==========================================
           GAYA TIM PENELAAH
           ========================================== */
        .penelaah-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 35px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .penelaah-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.35rem;
            color: #4a3319;
            margin-bottom: 20px;
            border-left: 4px solid #b35c24;
            padding-left: 12px;
            line-height: 1;
            font-weight: 800;
        }
        .reviewer-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #ffffff;
            border: 1px solid #f2f2f2;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.01);
            text-align: left;
            transition: transform 0.2s ease;
        }
        .reviewer-card:hover { transform: translateY(-2px); }
        .reviewer-card:last-child { margin-bottom: 0; }
        
        .reviewer-card.border-brown { border-left: 5px solid #b35c24; }
        .reviewer-card.border-green { border-left: 5px solid #27ae60; }
        .reviewer-card.border-blue { border-left: 5px solid #2980b9; }

        .reviewer-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .reviewer-card.border-brown .reviewer-icon { background: #fdf5ef; }
        .reviewer-card.border-green .reviewer-icon { background: #effdf4; }
        .reviewer-card.border-blue .reviewer-icon { background: #eff7fd; }

        .reviewer-info { display: flex; flex-direction: column; gap: 1px; }
        .reviewer-name { font-family: 'Baloo 2', cursive; font-size: 1.05rem; font-weight: 700; color: #2c3e50; margin: 0; line-height: 1.3; }
        .reviewer-nip { font-size: 0.8rem; color: #7f8c8d; font-weight: bold; margin-top: 1px; letter-spacing: 0.3px; }
        .reviewer-role { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
        
        .reviewer-card.border-brown .reviewer-role { color: #b35c24; }
        .reviewer-card.border-green .reviewer-role { color: #27ae60; }
        .reviewer-card.border-blue .reviewer-role { color: #2980b9; }

        /* ==========================================
           AREA TIM PENYUSUN & PENGEMBANG DESAIN
           ========================================== */
        .team-wrapper {
            position: relative;
            margin-top: 50px;
            padding: 35px 15px 20px 15px;
            border-radius: 20px;
            border: 2px dashed rgba(45, 138, 78, 0.25);
            background: rgba(45, 138, 78, 0.01);
            margin-bottom: 35px;
        }

        .team-badge {
            background: linear-gradient(135deg, var(--forest-mid) 0%, var(--leaf-vivid) 100%);
            color: white;
            padding: 8px 30px;
            border-radius: 50px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.25);
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            white-space: nowrap;
            font-weight: 800;
        }

        .dev-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
            margin-top: 5px; 
        }

        /* Centering untuk grid Dr. Fara */
        .dev-grid-center {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }
        .dev-grid-center .dev-member {
            width: 180px;
        }

        /* Label Peran di Atas Foto */
        .member-title-top {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--forest-mid);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .dev-member { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 18px 10px; 
            border-radius: 14px; 
            border: 1px solid rgba(45, 138, 78, 0.12); 
            text-align: center; 
            transition: all 0.2s ease; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dev-member:hover { 
            transform: translateY(-5px); 
            background: #ffffff;
            border-color: var(--sunny-yellow);
            box-shadow: 0 6px 15px rgba(249, 202, 36, 0.2);
        }

        .dev-ava img { 
            width: 65px; height: 65px; 
            border-radius: 50%; 
            border: 2.5px solid var(--sunny-yellow); 
            box-shadow: 0 3px 8px rgba(249, 202, 36, 0.15);
            margin: 0 auto 10px;
            object-fit: cover;
        }

        .dev-name { font-family: 'Baloo 2'; font-weight: 700; color: var(--forest-mid); font-size: 0.95rem; line-height: 1.3; margin-bottom: 3px; }
        .dev-nim { font-size: 0.78rem; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.3px; }
        
        /* Gaya Tampilan Kampus & Prodi */
        .dev-univ { font-size: 0.72rem; font-weight: 700; color: var(--forest-dark); margin-top: 8px; line-height: 1.2; border-top: 1px dashed rgba(0,0,0,0.06); padding-top: 6px; }
        .dev-prodi { font-size: 0.65rem; font-weight: 800; color: #d35400; background: rgba(249, 202, 36, 0.12); padding: 2px 6px; border-radius: 8px; display: inline-block; margin-top: 3px; border: 1px solid rgba(249, 202, 36, 0.2); text-transform: uppercase; letter-spacing: 0.2px; }

        /* Universitas Badge */
        .univ-badge { 
            text-align: center; 
            margin-top: 15px; 
            padding: 18px; 
            background: rgba(249, 202, 36, 0.06); 
            border: 1.5px solid rgba(249, 202, 36, 0.25); 
            border-radius: 16px; 
        }
        .univ-badge h3 { font-family: 'Baloo 2'; color: var(--forest-dark); font-size: 1.3rem; margin-bottom: 3px; }
        .univ-badge h4 { font-size: 0.85rem; color: var(--forest-dark); font-weight: bold; letter-spacing: 0.5px; }

        /* Review Section */
        .btn-gold { 
            background: linear-gradient(to bottom, var(--sunny-yellow), var(--honey-orange));
            color: var(--wood-dark); font-weight: 800; padding: 10px 25px; border-radius: 50px;
            border: none; cursor: pointer; transition: 0.2s; font-size: 0.95rem;
        }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(249, 202, 36, 0.4); }
        
        .divider { border: 0; height: 1px; background: rgba(45, 138, 78, 0.15); margin: 30px 0; }
        .section-title { font-family: 'Baloo 2'; font-size: 1.4rem; color: var(--forest-mid); font-weight: 800; margin-bottom: 15px;}
    </style>
</head>

        function submitSaran() {
            const text = document.getElementById('saranText').value.trim();
            if (!text) {
                alert('Tulis saranmu dulu ya! 😊');
                return;
            }
            const s = SpaceStore.get();
            SpaceStore.addFeedback(text, s.username, s.kelas);
            
            if(typeof AudioManager !== 'undefined') AudioManager.playClick();
            alert('Terima kasih atas saran dan masukanmu! 🌿');
            document.getElementById('saranText').value = '';
