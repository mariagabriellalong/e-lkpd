<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kuis Tantangan Rimba Pecahan - Uji kemampuan pecahanmu!">
    <title>Rimba Pecahan - Kuis Tantangan</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-panel { max-width: 750px; margin: 24px auto; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .quiz-stat { font-family: 'Baloo 2'; font-weight: 800; font-size: 1.1rem;
            padding: 8px 16px; border-radius: var(--radius-full);
            background: rgba(45, 138, 78, 0.08); border: 1px solid rgba(45, 138, 78, 0.3); color: var(--forest-dark); }
        .quiz-q { font-family: 'Baloo 2'; font-size: 1.25rem; font-weight: 600;
            text-align: left; line-height: 1.6; color: var(--forest-dark); 
            padding: 24px; background: rgba(255, 255, 255, 0.9); border: 2px solid var(--leaf-vivid); 
            border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .quiz-visual { text-align: center; }
        .quiz-opts { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; margin: 24px 0; }
        .qopt { background: rgba(255, 255, 255, 0.7); border: 2px solid rgba(45, 138, 78, 0.3);
            color: var(--forest-dark); font-family: 'Baloo 2'; font-size: 1.4rem;
            font-weight: 800; padding: 18px; border-radius: var(--radius-md); cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .qopt:hover { background: rgba(255, 255, 255, 1); border-color: var(--leaf-vivid); transform: scale(1.03); box-shadow: 0 6px 15px rgba(45, 138, 78, 0.15); }
        .qopt.correct { border-color: var(--leaf-vivid) !important;
            background: rgba(39, 174, 96, 0.15) !important; box-shadow: 0 0 20px rgba(39, 174, 96, 0.3) !important; color: var(--leaf-vivid); }
        .qopt.wrong { animation: shake 0.5s; border-color: #e74c3c !important;
            background: rgba(231, 76, 60, 0.15) !important; color: #e74c3c; }
        .quiz-fb { text-align: center; font-weight: 700; font-size: 1.15rem; min-height: 28px; margin-top: 10px; }
        .result-panel { text-align: center; animation: zoomIn 0.6s ease; }
        .result-emoji { font-size: 5rem; margin-bottom: 12px; }
        .result-score { font-family: 'Baloo 2'; font-size: 2.8rem; font-weight: 900;
            color: var(--sunny-yellow); text-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .result-detail { color: var(--text-secondary); margin: 10px 0 24px; font-size: 1.15rem; }
        
        /* RESPONSIVE DESIGN - Make mobile look like desktop but scaled */
        @media(max-width:500px) { 
            /* Keep 2 columns on mobile to match desktop layout */
            .quiz-opts { grid-template-columns: repeat(2,1fr); gap: 12px; } 
            /* Prevent fonts from being too big on mobile */
            .qopt { font-size: 1.15rem; padding: 14px; } 
            .quiz-q { font-size: 1.1rem; padding: 16px; } 
            .quiz-stat { font-size: 1rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <script src="js/script.js"></script>
    <!-- SOUND APRESIASI -->
<audio id="horeSound" src="sound/hore.mp3"></audio>
<audio id="clapSound" src="sound/clap.mp3"></audio>
<script>

renderTopNav('Tantangan Rimba', true, 'dashboard.html');

// ================= QUIZ DATA =================
const quizQs = [
    {
        id:'kq1',
        q:'Perhatikan gambar martabak manis berikut!<br><br>Bayangkan kamu membeli sebuah martabak manis berbentuk lingkaran seperti pada deskripsi gambar di atas. Martabak tersebut sudah dipotong menjadi 6 bagian yang sama besar. Kamu lalu memberikan 4 bagian yang berwarna kuning kepada teman-temanmu.<br><br>Berapakah nilai pecahan untuk bagian martabak yang berwarna kuning tersebut?',
        img:'game1.png',
        opts:['2/6','4/6','5/6','6/6'],
        correct:'4/6',
        hint:'Ada 4 bagian kuning dari total 6 bagian martabak.'
    },
    {
        id:'kq3',
        q:'Di dalam kotak mainan Dino, terdapat 10 buah kelereng dengan ukuran yang sama. Setelah dilihat dengan teliti, ada 3 kelereng berwarna merah, sedangkan sisanya berwarna biru.<br><br>Berapakah pecahan yang menunjukkan banyaknya kelereng berwarna merah dibandingkan dengan seluruh kelereng yang ada di dalam kotak Dino?',
        opts:['3/10','7/10','10/3','2/10'],
        correct:'3/10',
        hint:'Ada 3 kelereng merah dari total 10 kelereng.'
    },
    {
        id:'kq4',
        q:'Andi, Beni, dan Cici masing-masing mendapatkan satu gulung tali rafi yang ukurannya sama persis dari ayah untuk membuat kerajinan tangan. Tali mereka masing-masing sudah ditandai menjadi 12 potongan kecil yang sama panjang.<br><br>Andi menggunakan 4/12 bagian talinya.<br><br>Beni menggunakan 7/12 bagian talinya.<br><br>Cici menggunakan 5/12 bagian talinya.<br><br>Jika kita melihat bagian yang mereka gunakan, siapakah anak yang menggunakan tali paling panjang?',
        opts:['Andi','Beni','Cici','Andi dan Cici'],
        correct:'Beni',
        hint:'Bandingkan pembilangnya. Angka 7 lebih besar dari 4 dan 5.'
    },
    {
        id:'kq5',
        q:'Kakak menuliskan lima angka pecahan secara acak di selembar kertas, yaitu: 5/9, 2/9, 8/9, 1/9, dan 4/9. Kakak memintamu untuk menyusun kembali pecahan-pecahan tersebut mulai dari yang nilainya paling kecil hingga ke yang paling besar.<br><br>Setelah kamu berhasil menyusunnya dengan rapi, pecahan manakah yang posisinya berada tepat di tengah-tengah urutan?',
        opts:['2/9','4/9','5/9','8/9'],
        correct:'4/9',
        hint:'Urutkan dari yang terkecil: 1/9, 2/9, 4/9, 5/9, 8/9. Mana yang posisinya di tengah?'
    },
    {
        id:'kq2',
        q:'Perhatikan gambar kue lapis berikut!<br><br>Sebuah kue lapis dipotong menjadi 5 bagian yang sama besar seperti pada ilustrasi di atas. Dari kelima potongan tersebut, ada 2 potongan yang diberi topping keju parut di atasnya, sedangkan potongan sisanya dibiarkan polos.<br><br>Berapakah nilai pecahan yang menunjukkan potongan kue lapis dengan topping keju?',
        img:'game2.png',
        opts:['1/5','2/5','3/5','5/5'],
        correct:'2/5',
        hint:'Ada 2 potong dengan topping keju dari total 5 potong kue.'
    },
    {
        id:'kq6',
        q:'Ibu membeli sebuah roti tawar panjang di supermarket. Roti tersebut kemudian dipotong-potong menjadi 8 bagian sama besar. Sebelum sarapan dimulai, Siska mengambil 3 bagian roti untuk dimakan bersama susu.<br><br>Maka, bentuk pecahan untuk bagian roti yang diambil oleh Siska adalah....',
        opts:['1/8','3/8','5/8','8/8'],
        correct:'3/8',
        hint:'Siska mengambil 3 bagian dari total 8 bagian roti.'
    }
];

// ================= GAMBAR KUIS =================
function renderVisualQuiz(q) {
    if (q.img) {
        return `<img src="img/${q.img}" alt="Visualisasi Kuis" style="max-width:100%; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); max-height:250px;">`;
    }
    return '';
}

// ================= QUIZ =================
let qi = 0,
    qScore = 0,
    qCorrect = 0;

function startTimer() { }

function loadQuiz() {

    const q = quizQs[qi];

    const shuffled =
        [...q.opts].sort(() => Math.random() - 0.5);

    const showHint =
        SpaceStore.shouldShowHint(q.id);

    document.getElementById('quizArea').innerHTML = `

        <div class="quiz-header">

            <span class="quiz-stat">
                Soal ${qi+1}/${quizQs.length}
            </span>

            <span class="quiz-stat">
                ✅ ${qCorrect}/${qi}
            </span>

            <span class="quiz-stat">
                🏆 ${qScore}
            </span>

        </div>

        <div class="quiz-q fun-callout yellow">

            <div class="quiz-visual" style="margin: ${q.img ? '0 0 20px 0' : '0'};">
                ${renderVisualQuiz(q)}
            </div>

            ${q.q}

        </div>

        <div class="quiz-opts">

            ${shuffled.map(o => `

                <button class="qopt"
                    onclick="checkQuiz(this,'${o}')">

                    ${o}

                </button>

            `).join('')}

        </div>

        <div style="text-align:center;margin-top:10px">

            <button class="btn-hint ${showHint ? 'visible' : ''}"
                id="quizHintBtn"
                onclick="showQuizHint()">

                <span class="hint-icon">🦉</span>

                Petunjuk dari Tuan Enggang

            </button>

        </div>

        <div class="quiz-fb" id="quizFb"></div>
    `;

    startTimer();
}

function checkQuiz(btn, val) {

    const q = quizQs[qi];

    document.querySelectorAll('.qopt')
        .forEach(b => b.style.pointerEvents = 'none');

    if (val === q.correct) {

        btn.classList.add('correct');

        AudioManager.playCorrect();

        SpaceStore.registerCorrectAnswer();

        const xp = SpaceStore.addXP(100, 0);

        qScore += xp;

        qCorrect++;

        document.getElementById('quizFb').innerHTML =
            `<span style="color:var(--leaf-vivid)">✅ Benar! +${xp} XP</span>`;

    } else {

        btn.classList.add('wrong');

        AudioManager.playWrong();

        const attempts =
            SpaceStore.registerWrongAnswer(q.id);

        qScore = Math.max(0, qScore - 20);

        document.getElementById('quizFb').innerHTML =
            '<span style="color:#e74c3c">❌ Jawaban salah!</span>';

        if (attempts > 2) {

            const hb =
                document.getElementById('quizHintBtn');

            if (hb)
                hb.classList.add('visible');
        }

        setTimeout(() => {

            document.querySelectorAll('.qopt')
                .forEach(b => {

                    if (!b.classList.contains('wrong'))
                        b.style.pointerEvents = 'auto';
                });

        }, 800);

        return;
    }

    setTimeout(() => {

        qi++;

        qi >= quizQs.length
            ? showResult()
            : loadQuiz();

    }, 1500);
}

function showQuizHint() {

    AudioManager.playClick();

    document.getElementById('quizFb').innerHTML =
        `<span style="color:var(--honey-orange)">🦉 ${quizQs[qi].hint}</span>`;
}

function showResult() {

    // MAINKAN SOUND APRESIASI
    document.getElementById('horeSound').play();
    setTimeout(() => {
        document.getElementById('clapSound').play();
    }, 1000);

    SpaceStore.completeMission('mission3');

    SpaceStore.addBadge('🌟');

    const pct =
        Math.round((qCorrect / quizQs.length) * 100);

    const emoji =
        pct >= 80 ? '🌟'
        : pct >= 60 ? '👍'
        : '💪';

    document.getElementById('quizArea').innerHTML = `

        <div class="result-panel">

            <div class="result-emoji">${emoji}</div>

            <div style="
                font-family:'Baloo 2';
                font-size:1.8rem;
                font-weight:800;
                margin-bottom:6px;
                color:var(--forest-dark)">

                🎉 Kuis Selesai! 🎉

            </div>

            <div class="result-score"
                id="resScore">

                0

            </div>

            <div class="result-detail">

                ${qCorrect} dari ${quizQs.length}
                soal benar (${pct}%)

            </div>

            <h2 style="
                color:var(--sunny-yellow);
                text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
                margin-bottom:20px;
                animation:pulse 1s infinite;
            ">
                🥳 HOREE! KAMU HEBAT! 🥳
            </h2>

            <button class="btn-gold"
                onclick="navigasiHalaman('dashboard.html')">

                Kembali ke Peta Rimba 🗺️

            </button>

        </div>
    `;

    setTimeout(() => {

        animateCounter(
            document.getElementById('resScore'),
            0,
            qScore,
            1200
        );

    }, 300);
}
document.body.insertAdjacentHTML(
    'beforeend',
    `<main class="page-container">
        <div class="kid-card quiz-panel"
            id="quizArea">
            <div class="card-accent rainbow"></div>
            Memuat...

        </div>
    </main>`
);

loadQuiz();

</script>
</body>
</html>
