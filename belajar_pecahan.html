<!DOCTYPE html>
<html lang="id">

<head>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;700&display=swap">
    <style>
        /* Reset & Base Variables */
        * {
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        :root {
            --primary-green: #2d8a4e;
            --light-green: #52b788;
            --accent-orange: #f0932b;
            --accent-blue: #2cc4b6;
            --accent-purple: #8e44ad;
            --sunny-yellow: #f9ca24;
            --text-dark: #1a4a2a;
            --bg-card: #ffffff;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px rgba(45, 138, 78, 0.08);
            --shadow-lg: 0 16px 32px rgba(45, 138, 78, 0.12);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: #f4fbf7;
            margin: 0;
            padding: 0;
        }

        /* Container & Layout */
        .page-container {
            padding: 0 16px;
        }

        .station-panel {
            max-width: 850px;
            margin: 32px auto;
            padding: 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-lg);
            width: 100%;
            border: 2px solid #e2f4e9;
        }

        .step-content {
            display: none;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .step-content.active {
            display: block;
        }

        /* Stepper Custom Engine */
        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            gap: 8px;
            user-select: none;
        }

        .step-dot {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-family: 'Baloo 2', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 3px solid #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .step-dot.active {
            background: var(--primary-green);
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(45, 138, 78, 0.3);
        }

        .step-dot.completed {
            background: var(--light-green);
            color: white;
        }

        .step-line {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            max-width: 70px;
            border-radius: 10px;
            transition: var(--transition-smooth);
        }

        .step-line.completed {
            background: var(--light-green);
        }

        /* Kid-Card Premium Stylings */
        .kid-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            position: relative;
            box-shadow: var(--shadow-md);
            border: 2px solid #f0f5f2;
            transition: var(--transition-smooth);
            margin-bottom: 24px;
            overflow: hidden;
            width: 100%;
        }

        .kid-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(82, 183, 136, 0.3);
        }

        .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
        }

        .card-accent.green { background: linear-gradient(90deg, var(--primary-green), var(--light-green)); }
        .card-accent.blue { background: linear-gradient(90deg, #3498db, var(--accent-blue)); }
        .card-accent.orange { background: linear-gradient(90deg, #e67e22, var(--accent-orange)); }
        .card-accent.purple { background: linear-gradient(90deg, #9b59b6, var(--accent-purple)); }
        .card-accent.red { background: linear-gradient(90deg, #e74c3c, #ff7675); }

        /* Typography */
        .main-title {
            font-family: 'Baloo 2', cursive, sans-serif;
            font-size: 2.4rem;
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 800;
            line-height: 1.2;
        }

        /* Callouts */
        .fun-callout {
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            line-height: 1.6;
            transition: var(--transition-smooth);
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.05);
        }
        .fun-callout h3 {
            margin-top: 0;
            font-family: 'Baloo 2', cursive;
            font-size: 1.3rem;
        }
        .fun-callout.green { background: #eef9f3; border-left: 6px solid var(--primary-green); color: #1e5331; }
        .fun-callout.red { background: #fff5f5; border-left: 6px solid #e74c3c; color: #c0392b; }
        .fun-callout.yellow { background: #fef9e7; border-left: 6px solid var(--sunny-yellow); color: #7d6608; }
        .fun-callout.blue { background: #ebf5fb; border-left: 6px solid #3498db; color: #21618c; }
        .fun-callout.purple { background: #f5eef8; border-left: 6px solid var(--accent-purple); color: #6c3483; }

        /* Grids (Fluid & Responsive) */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .bento-card {
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition-smooth);
        }

        /* Custom Fraction Display Engine */
        .fraction-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 2px dashed #d5e8dc;
            flex-wrap: wrap;
        }

        .fraction-render {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            background: #f4fbf7;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .fraction-line-ui {
            border-bottom: 4px solid var(--text-dark);
            width: 40px;
            margin: 6px 0;
            border-radius: 2px;
        }

        /* Video Player */
        .yt-player {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 24px 0;
            background: #000;
            box-shadow: 0 12px 30px rgba(45, 138, 78, 0.2);
            aspect-ratio: 16/9;
        }
        .yt-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Stepper & Navigation Controls */
        .step-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            gap: 16px;
        }

        .btn-primary, .btn-secondary {
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-green), var(--light-green)); 
            color: white; 
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(45, 138, 78, 0.3);
        }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }

        /* Target Goal Card Style */
        .target-card {
            background: #ffffff;
            border: 2px dashed #b7e4c7;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: var(--transition-smooth);
        }
        .target-card:hover {
            border-color: var(--primary-green);
            background: #fafefe;
        }
        .target-icon {
            font-size: 2rem;
            background: #eef9f3;
            padding: 10px;
            border-radius: 12px;
            line-height: 1;
        }

        /* Micro-Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes microBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-bounce-slow {
            display: inline-block;
            animation: microBounce 2.5s infinite ease-in-out;
        }

        /* Responsive Mobile Engine */
        @media screen and (max-width: 768px) {
            .station-panel { margin: 16px 0; padding: 20px 16px; border-radius: 16px; }
            .kid-card { padding: 20px 16px; }
            .main-title { font-size: 1.8rem; margin-bottom: 16px; }
            .fun-callout { padding: 16px; }
            .fraction-box { flex-direction: column; text-align: center; gap: 16px; }
            .metric-visualizer { flex-direction: column; gap: 12px; }
            .metric-visualizer .arrow { transform: rotate(90deg); }
            .step-nav { flex-direction: column-reverse; gap: 12px; }
            .step-nav button { width: 100%; justify-content: center; padding: 16px; }
            .step-dot { width: 36px; height: 36px; font-size: 1rem; }
        }
    </style>
</head>

                                    <div style="text-align: center;"><span style="display:block; font-size: 1.05rem; font-weight: 800; color:#2980b9;">Penyebut</span><span style="font-size:0.8rem; color:#7f8c8d;">(Bawah)</span></div>
                                </div>
                            </div>

                            <div class="bento-card" style="background: linear-gradient(135deg, #ffffff, #eef9f9); border: 2px solid var(--accent-blue);">
                                <div>
                                    <div style="background: var(--accent-blue); color: white; display: inline-block; padding: 6px 16px; border-radius: 30px; font-family: 'Baloo 2'; font-weight: 800; font-size: 1.05rem; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(44,196,182,0.2);">
                                        ⚖️ 2. Membandingkan Pecahan
                                    </div>
                                    <p style="font-size: 1rem; line-height: 1.6; color: #0f4c5c; margin: 0; text-align: justify;">
                                        Membandingkan pecahan dilakukan untuk mengetahui pecahan yang lebih besar, lebih kecil, atau sama besar. Pada pecahan dengan pembilang satu, semakin kecil penyebutnya maka semakin besar nilai pecahannya.
                                    </p>
                                </div>

                                <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px;">
                                    <div style="background: #ffffff; padding: 8px 10px; border-radius: 8px; border-left: 4px solid #f39c12; font-size: 0.8rem; color:#7f8c8d; line-height: 1.4;"><strong style="color:#d35400;">Pembilang 1:</strong> Penyebut kecil = Nilai makin besar!</div>
                                    <div style="background: #ffffff; padding: 8px 10px; border-radius: 8px; border-left: 4px solid #c0392b; font-size: 0.8rem; color:#7f8c8d; line-height: 1.4;"><strong style="color:#c0392b;">Penyebut Sama:</strong> Pembilang besar = Nilai makin besar!</div>
                                </div>
                            </div>

                            <div class="bento-card" style="background: linear-gradient(135deg, #ffffff, #fdfaf4); border: 2px solid var(--accent-purple);">
                                <div>
                                    <div style="background: var(--accent-purple); color: white; display: inline-block; padding: 6px 16px; border-radius: 30px; font-family: 'Baloo 2'; font-weight: 800; font-size: 1.05rem; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(142,68,173,0.2);">
                                        📊 3. Mengurutkan Pecahan
                                    </div>
                                    <p style="font-size: 1rem; line-height: 1.6; color: #5b2c6f; margin: 0; text-align: justify;">
                                        Mengurutkan pecahan adalah menyusun beberapa pecahan berdasarkan nilainya, baik dari yang terkecil ke terbesar maupun dari yang terbesar ke terkecil dengan membandingkan komponennya.
                                    </p>
                                </div>

                                <div style="margin-top: 16px; background: #ffffff; border: 2px dashed #d7bde2; border-radius: 12px; padding: 12px; display: flex; justify-content: space-around; align-items: center; font-size: 0.85rem; color:#7f8c8d;">
                                    <div style="text-align: center;">📈 <strong style="color:var(--accent-purple);">Urutan Naik</strong><br><span style="font-size:0.75rem;">Kecil ➔ Besar</span></div>
                                    <div style="text-align: center;">📉 <strong style="color:var(--accent-orange);">Urutan Turun</strong><br><span style="font-size:0.75rem;">Besar ➔ Kecil</span></div>
                                </div>
                            </div>
                        </div>

                        <div style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 2px dashed #d5e8dc;">
                            <div style="font-size: 3.5rem; margin-bottom: 8px;" class="animate-bounce-slow">🌟</div>
                            <p style="font-family: 'Baloo 2'; font-size: 1.3rem; font-weight: 800; color: var(--primary-green); margin: 0 0 4px 0;">
                                Tetap semangat berlatihnya ya!
                            </p>
                            <p style="font-size: 1.1rem; color: #555; margin: 0;">
                                Semakin sering berlatih, kamu pasti akan semakin jago! 🦉✨
                            </p>
                        </div>
                    </div>
                </div>

                <div class="step-nav">
                    <button class="btn-secondary" id="btnPrev" style="display:none" onclick="changeStep(-1)">⬅ Sebelumnya</button>
                    <button class="btn-primary" id="btnNext" onclick="changeStep(1)">Selanjutnya ➡</button>
                </div>
            </div>
        </main>`);

        // Fungsi Render Indikator Angka (1-5) beserta garis penghubung
        function renderStepper() {
            const el = document.getElementById('stepper');
            if(!el) return;
            let html = '';
            for (let i = 1; i <= totalSteps; i++) {
                const cls = i === currentStep ? 'active' : (i < currentStep ? 'completed' : '');
                html += `<div class="step-dot ${cls}" onclick="goToStep(${i})">${i < currentStep ? '✓' : i}</div>`;
                if (i < totalSteps) {
                    const lineCls = i < currentStep ? 'completed' : '';
                    html += `<div class="step-line ${lineCls}"></div>`;
                }
            }
            el.innerHTML = html;
        }

        function changeStep(dir) {
            const next = currentStep + dir;
            if (next < 1 || next > totalSteps) {
                if (next > totalSteps && typeof SpaceStore !== 'undefined') {
                    SpaceStore.completeMission('mission1');
                    SpaceStore.addBadge('📚');
                    navigasiHalaman('dashboard.html');
                }
                return;
            }
            goToStep(next);
        }

        function goToStep(n) {
            if(typeof AudioManager !== 'undefined') AudioManager.playClick();
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            currentStep = n;
            renderStepper();
            
            // Atur tombol visibilitas dan teks halaman
            document.getElementById('btnPrev').style.display = n > 1 ? '' : 'none';
            document.getElementById('btnNext').textContent = n === totalSteps ? 'Selesai & Lanjut 🌿' : 'Selanjutnya ➡';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Inisialisasi awal stepper saat dimuat
        renderStepper();
    </script>
</body>

</html>
