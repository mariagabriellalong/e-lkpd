<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gubuk Belajar Pecahan - Materi pembelajaran pecahan interaktif untuk siswa SD di hutan ajaib.">
    <title>Rimba Pecahan - Gubuk Belajar</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .station-panel {
            max-width: 800px;
            margin: 24px auto;
        }

        .objective-banner {
            background: linear-gradient(135deg, rgba(82, 183, 136, 0.15), rgba(46, 204, 113, 0.1));
            border: 2px solid rgba(82, 183, 136, 0.3);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 24px;
        }

        .objective-banner h3 {
            color: var(--forest-dark);
            font-family: 'Baloo 2';
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .objective-banner p {
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .step-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .step-content.active {
            display: block;
        }

        .content-card {
            margin-bottom: 20px;
        }

        .content-card h2 {
            font-family: 'Baloo 2';
            font-size: 2rem;
            color: var(--forest-dark);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff, 2px 2px 0px rgba(45, 138, 78, 0.1);
        }

        .content-card p {
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        /* Fun custom styles for kid-friendly learning */
        #step1 .content-card .bubble-paragraph {
            background: linear-gradient(135deg, #ffffff, var(--cream));
            border: 3px solid var(--forest-light);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: 0 10px 25px rgba(45, 138, 78, 0.08);
            position: relative;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #1a4a2a;
            margin-bottom: 20px;
            text-align: justify;
        }
        
        .mascot-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(249, 202, 36, 0.15), rgba(240, 147, 43, 0.1));
            border-radius: var(--radius-md);
            padding: 15px 24px;
            border: 2px dashed var(--sunny-yellow);
        }
        
        .mascot-avatar {
            font-size: 3.5rem;
            animation: breathe 3s ease-in-out infinite;
        }
        
        .mascot-text {
            font-family: 'Baloo 2';
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--forest-dark);
        }

        #step2 .content-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin-top: 15px;
        }

        .topic-card {
            background: #ffffff;
            border: 2px solid rgba(82, 183, 136, 0.15);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            box-shadow: 0 6px 16px rgba(45, 138, 78, 0.04);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .topic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: var(--forest-light);
        }
        
        .topic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(45, 138, 78, 0.12);
            border-color: rgba(82, 183, 136, 0.35);
        }
        
        .topic-card h3 {
            font-family: 'Baloo 2';
            font-size: 1.35rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .topic-card p {
            margin: 0 !important;
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* ===== YouTube Thumbnail Player ===== */
        .yt-player {
            position: relative;
            width: 100%;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin: 16px 0;
            background: #000;
            box-shadow: 0 8px 40px rgba(45,138,78,0.3);
            cursor: pointer;
            aspect-ratio: 16/9;
        }

        .yt-player img.yt-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
            filter: brightness(0.85);
        }

        .yt-player:hover img.yt-thumb {
            transform: scale(1.03);
            filter: brightness(0.7);
        }

        .yt-player .yt-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(to top, rgba(26,92,53,0.7) 0%, rgba(26,92,53,0.1) 60%);
            transition: background 0.3s ease;
        }

        .yt-player:hover .yt-overlay {
            background: linear-gradient(to top, rgba(26,92,53,0.85) 0%, rgba(26,92,53,0.25) 60%);
        }

        .yt-play-btn {
            width: 72px;
            height: 72px;
            background: #FF0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 6px rgba(255,0,0,0.25), 0 4px 24px rgba(45,138,78,0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .yt-player:hover .yt-play-btn {
            transform: scale(1.15);
            box-shadow: 0 0 0 10px rgba(255,0,0,0.3), 0 6px 30px rgba(45,138,78,0.6);
        }

        .yt-play-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
            margin-left: 4px;
        }

        .step-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            gap: 12px;
        }

        .astronaut-idle {
            font-size: 4.5rem;
            text-align: center;
            animation: breathe 4s ease-in-out infinite;
            margin: 16px 0;
        }
    </style>
</head>

<body>
    <script src="js/script.js"></script>
    <script>
        renderTopNav('Gubuk Belajar', true, 'dashboard.html');

        var totalSteps = 4; // Diubah dari 3 ke 4 untuk halaman kesimpulan
        var currentStep = 1;

        document.body.insertAdjacentHTML('beforeend', `
        <main class="page-container">
            <div class="glass-panel station-panel">
                <div class="stepper" id="stepper"></div>

                <div class="step-content active" id="step1">
                    <div class="kid-card">
                        <div class="card-accent green"></div>
                        <h2 style="font-size: 2.4rem; margin-bottom: 24px; color: var(--forest-dark); font-family: 'Baloo 2', cursive;"> Alur Tujuan Pembelajaran</h2>
                        <div class="fun-callout green">
                            <p style="font-size: 1.1rem;">• Murid dapat menunjukkan pemahaman pecahan sebagai konteks membagi sebuah benda.</p>
                        </div>
                        <div class="fun-callout red">
                            <p style="font-size: 1.1rem;">• Murid dapat melakukan perbandingan dan pengurutan pecahan dengan  pembilang satu dan antar pecahan dengan penyebut yang sama.</p>
                        </div>
                    </div>
                </div>

                <div class="step-content" id="step2">
                    <div class="kid-card">
                        <div class="card-accent blue"></div>
                        <div class="astronaut-idle wiggle">🦉</div>
                        <h2 style="font-size: 2.2rem; font-family: 'Baloo 2'; color: var(--forest-dark); text-align: center; margin-bottom: 12px;"><span class="sparkle-text">🎬 Apa itu Pecahan?</span></h2>
                        <p style="text-align:center; font-size: 1.15rem; margin-bottom:20px; color: var(--forest-mid); font-weight: bold;">Halo, Penjelajah Rimba! Sebelum kita menjelajah lebih jauh, yuk tonton video seru ini untuk mengenal apa itu pecahan!</p>
                        <div class="yt-player">
                            <iframe 
                                style="width: 100%; height: 100%; border: none;"
                                src="https://www.youtube.com/embed/nwXZV4fLwx8" 
                                title="Video Pembelajaran Pecahan" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <p style="text-align:center;color:var(--sunny-yellow);font-size:1.1rem;margin-top:16px;font-weight:900; background: var(--forest-dark); padding: 8px; border-radius: 20px;">📺 Tonton video di atas langsung di halaman ini ya!</p>
                    </div>
                </div>

                <div class="step-content" id="step3">
                    <div class="kid-card">
                        <div class="card-accent orange"></div>
                        <h2 style="font-family: 'Baloo 2'; font-size: 2.4rem; color: var(--forest-dark); text-align: center; margin-bottom: 20px;">Penjelasan Pecahan 🍰</h2>
                        
                        <div class="fun-callout yellow">
                            <h3 style="color:var(--forest-dark); font-family:'Baloo 2'; font-size: 1.4rem; margin-bottom: 8px;">1. Pecahan</h3>
                            <p style="font-size: 1.15rem; line-height: 1.7; margin-bottom: 12px;">
                                Pecahan adalah bilangan yang digunakan untuk menyatakan bagian dari suatu keseluruhan. Pecahan menunjukkan bahwa suatu benda atau kumpulan benda dibagi menjadi beberapa bagian yang sama besar. Pecahan ditulis dalam bentuk:
                            </p>
                            <div style="display: flex; justify-content: center; align-items: center; gap: 20px; background: white; padding: 15px; border-radius: 12px; margin: 15px 0;">
                                <div class="fraction-display">
                                    <span class="numerator" style="font-size: 1.5rem; font-weight: 900;">a</span>
                                    <div class="fraction-line" style="border-bottom: 3px solid var(--forest-dark); width: 100%;"></div>
                                    <span class="denominator" style="font-size: 1.5rem; font-weight: 900;">b</span>
                                </div>
                                <div style="font-size: 1.1rem; font-weight: bold; color: var(--forest-mid);">
                                    <strong>Keterangan:</strong><br>
                                    🔢 <strong>a disebut pembilang</strong>, yaitu angka yang menunjukkan banyaknya bagian yang diambil atau diperhatikan.<br>
                                    🔢 <strong>b disebut penyebut</strong>, yaitu angka yang menunjukkan jumlah seluruh bagian yang sama besar.
                                </div>
                            </div>
                            <div style="background: rgba(46, 204, 113, 0.2); padding: 12px; border-radius: 10px; border-left: 4px solid var(--leaf-vivid); font-size: 1.1rem;">
                                <strong>Contoh:</strong> ¾ <br>
                                Pada pecahan tersebut:<br>
                                • Angka 3 adalah pembilang<br>
                                • Angka 4 adalah penyebut
                            </div>
                        </div>

                        <hr class="rainbow-divider">
                        
                        <div class="topic-grid">
                            <div class="kid-card" style="margin-bottom: 0; padding: 20px;">
                                <div class="card-accent blue"></div>
                                <h3 style="color:var(--forest-dark); font-family:'Baloo 2'; font-size: 1.4rem; margin-bottom: 10px;"><span class="bounce-emoji">⚖️</span> 2. Membandingkan Pecahan</h3>
                                <p style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 12px;">
                                    Membandingkan pecahan adalah proses menentukan hubungan nilai antara dua pecahan pecahan atau lebih untuk mengetahui pecahan mana yang nilainya lebih besar (>), lebih kecil (<) atau sama besar (=). Proses ini dilakukan dengan melihat porsi atau ukuran bagian dari keseluruhan yang diwakili oleh pecahan-pecahan tersebut.
                                </p>
                                <div style="background: rgba(116, 185, 255, 0.2); padding: 12px; border-radius: 10px; border-left: 4px solid var(--sky-blue); font-size: 1.1rem;">
                                    <strong>Contoh:</strong> ½ > ¼ <br>
                                    Artinya, satu per dua lebih besar daripada satu per empat karena satu benda yang dibagi menjadi 2 bagian menghasilkan potongan yang lebih besar dibandingkan jika dibagi menjadi 4 bagian.
                                </div>
                            </div>

                            <div class="kid-card" style="margin-bottom: 0; padding: 20px;">
                                <div class="card-accent purple"></div>
                                <h3 style="color:var(--forest-dark); font-family:'Baloo 2'; font-size: 1.4rem; margin-bottom: 10px;"><span class="bounce-emoji">📊</span> 3. Mengurutkan Pecahan</h3>
                                <p style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 12px;">
                                    Mengurutkan pecahan adalah proses menyusun tiga pecahan atau lebih secara berurutan berdasarkan nilainya. Penyusunan ini dapat dilakukan dengan dua cara:
                                </p>
                                <ul style="font-size: 1.1rem; line-height: 1.6; margin-left: 20px; color: var(--forest-dark);">
                                    <li style="margin-bottom: 8px;"><strong>Urutan Naik (Ascending):</strong> Menyusun pecahan mulai dari nilai yang paling kecil ke paling besar.</li>
                                    <li><strong>Urutan Turun (Descending):</strong> Menyusun pecahan mulai dari nilai yang paling besar ke paling kecil.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="step-content" id="step4">
                    <div class="kid-card">
                        <div class="card-accent green"></div>
                        <h2 style="font-family: 'Baloo 2'; font-size: 2.4rem; color: var(--forest-dark); text-align: center; margin-bottom: 20px;">Kesimpulan Belajar Kita 🎉</h2>
                        
                        <div class="fun-callout green" style="margin-bottom: 16px;">
                            <h3 style="color:var(--forest-dark); font-family:'Baloo 2'; font-size: 1.3rem; margin-bottom: 8px;">🍰 1. Apa itu Pecahan?</h3>
                            <p style="font-size: 1.1rem; line-height: 1.6; color: var(--forest-dark);">
                                <strong>Pecahan</strong> adalah bilangan yang menyatakan sebagian dari keseluruhan. Pecahan terdiri atas pembilang dan penyebut. Pembilang menunjukkan banyak bagian yang diambil, sedangkan penyebut menunjukkan jumlah seluruh bagian yang sama besar.
                            </p>
                        </div>

                        <div class="fun-callout blue" style="margin-bottom: 16px;">
                            <h3 style="color:var(--forest-dark); font-family:'Baloo 2'; font-size: 1.3rem; margin-bottom: 8px;">⚖️ 2. Membandingkan Pecahan</h3>
                            <p style="font-size: 1.1rem; line-height: 1.6; color: var(--forest-dark);">
                                Membandingkan pecahan dilakukan untuk mengetahui pecahan yang lebih besar, lebih kecil, atau sama besar. 
                                <br><br>
                                • Pada pecahan dengan <strong>pembilang satu</strong>: semakin <em>kecil</em> penyebutnya, maka semakin <strong>besar</strong> nilai pecahannya.<br>
                                • Pada pecahan dengan <strong>penyebut yang sama</strong>: semakin <em>besar</em> pembilangnya, maka semakin <strong>besar</strong> nilai pecahannya.
                            </p>
                        </div>

                        <div class="fun-callout purple" style="margin-bottom: 20px;">
                            <h3 style="color:var(--forest-dark); font-family:'Baloo 2'; font-size: 1.3rem; margin-bottom: 8px;">📊 3. Mengurutkan Pecahan</h3>
                            <p style="font-size: 1.1rem; line-height: 1.6; color: var(--forest-dark); margin-bottom: 12px;">
                                Mengurutkan pecahan adalah menyusun beberapa pecahan berdasarkan nilainya.
                            </p>
                            
                            <div style="background: rgba(255, 255, 255, 0.7); padding: 15px; border-radius: 10px; border-left: 4px solid #9b59b6; font-size: 1.1rem;">
                                <strong>Contoh:</strong> 2/7, 5/7, 3/7 <br><br>
                                Urutan dari yang terkecil ke terbesar adalah:<br>
                                <strong style="color: var(--forest-dark); font-size: 1.3rem;">2/7, 3/7, 5/7</strong> <br><br>
                                <em>💡 Ingat: Karena penyebutnya sama, semakin besar pembilangnya, semakin besar pula nilai pecahannya!</em>
                            </div>
                        </div>

                        <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 2px dashed rgba(82, 183, 136, 0.3);">
                            <div style="font-size: 3rem; margin-bottom: 10px; animation: bounce 2s infinite;">🌟</div>
                            <p style="font-size: 1.2rem; font-weight: bold; color: var(--forest-dark);">
                                Tetap semangat berlatihnya ya! Semakin sering berlatih, kamu pasti akan semakin jago! 🦉✨
                            </p>
                        </div>
                    </div>
                </div>

                <div class="step-nav">
                    <button class="btn-secondary" id="btnPrev" style="display:none" onclick="changeStep(-1)">⬅ Sebelumnya</button>
                    <div style="flex:1"></div>
                    <button class="btn-primary" id="btnNext" onclick="changeStep(1)">Selanjutnya ➡</button>
                </div>
            </div>
        </main>`);

        function renderStepper() {
            const el = document.getElementById('stepper');
            let html = '';
            for (let i = 1; i <= totalSteps; i++) {
                const cls = i === currentStep ? 'active' : (i < currentStep ? 'completed' : '');
                html += `<div class="step-dot ${cls}" onclick="goToStep(${i})">${i < currentStep ? '✓' : i}</div>`;
                if (i < totalSteps) html += `<div class="step-line ${i < currentStep ? 'completed' : ''}"></div>`;
            }
            el.innerHTML = html;
        }

        function changeStep(dir) {
            const next = currentStep + dir;
            if (next < 1 || next > totalSteps) {
                if (next > totalSteps) {
                    SpaceStore.completeMission('mission1');
                    SpaceStore.addBadge('📚');
                    navigasiHalaman('dashboard.html');
                }
                return;
            }
            goToStep(next);
        }

        function goToStep(n) {
            AudioManager.playClick();
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            currentStep = n;
            renderStepper();
            document.getElementById('btnPrev').style.display = n > 1 ? '' : 'none';
            document.getElementById('btnNext').textContent = n === totalSteps ? 'Selesai & Lanjut 🌿' : 'Selanjutnya ➡';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderStepper();
    </script>
</body>

</html>
