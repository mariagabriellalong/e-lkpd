<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Game Pizza Planet - Latihan interaktif pecahan dengan drag-and-drop.">
    <title>Galaksi Pecahan - Game Pizza Planet</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-panel { max-width: 800px; margin: 24px auto; }
        .game-header { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .game-stat { font-family: 'Baloo 2'; font-weight: 800; font-size: 1.1rem;
            padding: 6px 16px; border-radius: var(--radius-full);
            background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); }
        .combo-indicator { padding: 6px 16px; border-radius: var(--radius-full);
            font-weight: 800; font-size: 0.9rem; transition: all 0.3s ease; }
        .combo-indicator.fire { background: linear-gradient(135deg, #0066ff, #00aaff);
            color: white; animation: pulseGlow 1s ease infinite; }
        .combo-indicator.normal { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
        .question-area { text-align: center; margin: 20px 0; }
        .question-text { font-family: 'Baloo 2'; font-size: 1.5rem; font-weight: 800;
            color: var(--text-primary); margin-bottom: 16px; line-height: 1.4; }

        /* SVG Pizza Visual */
        .pizza-visual { margin: 20px auto; text-align: center; }
        .pizza-visual svg { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
            transition: transform 0.3s ease; cursor: default; }
        .pizza-visual svg:hover { transform: scale(1.05); }

        /* Drag and Drop */
        .dnd-area { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
            align-items: flex-start; margin: 20px 0; }
        .drag-item { padding: 14px 24px; border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.08); border: 2px solid var(--glass-border);
            font-family: 'Baloo 2'; font-weight: 800; font-size: 1.4rem;
            cursor: grab; user-select: none; touch-action: none;
            transition: all 0.2s ease; color: var(--text-primary); }
        .drag-item:hover { background: rgba(255,255,255,0.15); border-color: var(--star-gold);
            transform: translateY(-3px); box-shadow: 0 6px 16px rgba(255,215,0,0.2); }
        .drag-item:active { cursor: grabbing; transform: scale(1.1); }
        .drag-item.dragging { opacity: 0.4; }
        .drop-target { min-width: 140px; min-height: 70px; border: 3px dashed var(--glass-border);
            border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: var(--text-secondary); padding: 16px;
            transition: all 0.3s ease; background: rgba(255,255,255,0.02); }
        .drop-target.over { border-color: var(--plasma-cyan); background: rgba(0,229,255,0.08);
            box-shadow: 0 0 20px rgba(0,229,255,0.2); transform: scale(1.03); }
        .drop-target.correct { border-color: var(--aurora-green) !important;
            background: rgba(57,255,20,0.1) !important; border-style: solid !important; }
        .drop-target.wrong { border-color: #ff4444 !important; background: rgba(255,68,68,0.1) !important; }

        /* Options grid (for MC questions) */
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 20px 0; }
        .opt-btn { background: rgba(255,255,255,0.06); border: 2px solid var(--glass-border);
            color: var(--text-primary); font-family: 'Baloo 2'; font-size: 1.5rem;
            font-weight: 800; padding: 18px; border-radius: var(--radius-md); cursor: pointer;
            transition: all 0.3s ease; }
        .opt-btn:hover { background: rgba(255,255,255,0.15); border-color: white;
            transform: scale(1.03); box-shadow: 0 0 15px rgba(255,255,255,0.15); }
        .opt-btn.correct { border-color: var(--aurora-green) !important;
            background: rgba(57,255,20,0.15) !important; box-shadow: 0 0 25px rgba(57,255,20,0.3) !important; }
        .opt-btn.wrong { animation: shake 0.5s ease; border-color: #ff4444 !important;
            background: rgba(255,68,68,0.15) !important; }

        /* Hint button */
        .hint-area { text-align: center; margin-top: 12px; }
        .btn-hint { display: none; }
        .btn-hint.visible { display: inline-flex; align-items: center; gap: 8px;
            animation: slideUp 0.5s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }

        .feedback-text { text-align: center; font-weight: 700; font-size: 1.1rem; margin-top: 12px;
            min-height: 30px; }
        .fb-correct { color: var(--aurora-green); }
        .fb-wrong { color: #ff6666; }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <audio id="clapSound" src="sound/clap.mp3"></audio>
    <script src="js/script.js"></script>
    <script>
        renderTopNav('Game Pizza Planet', true, 'dashboard.html');

        // ============ QUESTION DATABASE ============
        // ============ QUESTION DATABASE ============
const questions = [
    {

        pizza:{ total:7, filled:7, color:'var(--star-gold)' },

];

        let currentQ = 0, score = 0, gameXP = 0;

       function renderPizzaSVG(cfg) {
    const size = 220;
    const cx = 110;
    const cy = 110;
    const r = 85;

    let slices = '';
    let toppings = '';

    for (let i = 0; i < cfg.total; i++) {

        const startAngle = ((i * 360 / cfg.total) - 90) * Math.PI / 180;
        const endAngle = ((((i + 1) * 360 / cfg.total)) - 90) * Math.PI / 180;

        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);

        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);

        const largeArc = (360 / cfg.total > 180) ? 1 : 0;

        // WARNA POTONGAN
        const fillColor =
            i < cfg.filled
                ? '#ffb347'
                : 'rgba(255,255,255,0.08)';

        // POTONGAN PIZZA
        slices += `
            <path
                d="M${cx},${cy}
                   L${x1},${y1}
                   A${r},${r} 0 ${largeArc},1 ${x2},${y2}
                   Z"
                fill="${fillColor}"
                stroke="#5a2d0c"
                stroke-width="2"
            />
        `;

        // TOPPING PEPERONI
        if (i < cfg.filled) {
            const midAngle = (startAngle + endAngle) / 2;

            const tx = cx + (r * 0.55) * Math.cos(midAngle);
            const ty = cy + (r * 0.55) * Math.sin(midAngle);

            toppings += `
                <circle cx="${tx}" cy="${ty}" r="10"
                    fill="#d62828"
                    stroke="#8b0000"
                    stroke-width="2"/>

                <circle cx="${tx-10}" cy="${ty+8}" r="6"
                    fill="#ff0000aa"/>

                <circle cx="${tx+12}" cy="${ty-6}" r="5"
                    fill="#ff0000aa"/>
            `;
        }
    }

    return `
    <svg width="${size}" height="${size}" viewBox="0 0 220 220">

        <!-- SHADOW -->
        <circle cx="${cx}" cy="${cy+6}" r="${r+18}"
            fill="rgba(0,0,0,0.25)"/>

        <!-- ROTI PINGGIR -->
        <circle cx="${cx}" cy="${cy}" r="${r+14}"
            fill="#d97706"
            stroke="#92400e"
            stroke-width="5"/>

        <!-- KEJU -->
        <circle cx="${cx}" cy="${cy}" r="${r}"
            fill="#ffd166"/>

        <!-- POTONGAN -->
        ${slices}

        <!-- TOPPING -->
        ${toppings}

        <!-- GARIS POTONG -->
        <circle cx="${cx}" cy="${cy}" r="${r}"
            fill="none"
            stroke="#5a2d0c"
            stroke-width="3"/>
    </svg>
    `;
}

        function loadQuestion() {
            const q = questions[currentQ];
            const state = SpaceStore.get();
            const container = document.getElementById('gameArea');

            let answersHTML = '';
            if (q.type === 'mc') {
                const shuffled = [...q.options].sort(() => Math.random() - 0.5);
                answersHTML = `<div class="options-grid">${shuffled.map(o =>
                    `<button class="opt-btn" onclick="checkMC(this,'${o}','${q.correct}')">${o}</button>`
                ).join('')}</div>`;
            } else {
                const shuffled = [...q.dragOptions].sort(() => Math.random() - 0.5);
                answersHTML = `
                    <div class="dnd-area">
                        ${shuffled.map(o => `<div class="drag-item" draggable="true" data-val="${o}">${o}</div>`).join('')}
                    </div>
                    <div style="text-align:center;margin:16px 0">
                        <div class="drop-target" id="dropZone" data-correct="${q.correct}">Lepaskan jawaban di sini</div>
                    </div>`;
            }

            const showHint = SpaceStore.shouldShowHint(q.id);

            container.innerHTML = `
                <div class="game-header">
                    <span class="game-stat">Soal ${currentQ+1}/${questions.length}</span>
                    <span class="combo-indicator ${state.isOnFire ? 'fire' : 'normal'}" id="comboInd">
                        ${state.isOnFire ? '🔥 COMBO x1.5!' : `Combo: ${state.comboCount}/3`}
                    </span>
                    <span class="game-stat">🏆 ${score}</span>
                </div>
                <div id="xpBarGame"></div>
                <div class="question-area">
                    <div class="pizza-visual">${renderPizzaSVG(q.pizza)}</div>
                    <div class="question-text">${q.q}</div>
                    ${answersHTML}
                    <div class="hint-area">
                        <button class="btn-hint ${showHint ? 'visible' : ''}" id="hintBtn" onclick="showHint()">
                            <span class="hint-icon">🦜</span> Petunjuk dari Enggang
                        </button>
                    </div>
                    <div class="feedback-text" id="feedback"></div>
                </div>`;

            renderXPBar('xpBarGame', gameXP, questions.length * 150);

            if (q.type === 'dnd') setupDnD();
        }

        function checkMC(btn, selected, correct) {
            const q = questions[currentQ];
            const allBtns = document.querySelectorAll('.opt-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('correct');
                handleCorrect();
            } else {
                btn.classList.add('wrong');
                handleWrong(q.id);
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    allBtns.forEach(b => b.style.pointerEvents = 'auto');
                }, 800);
            }
        }

        function setupDnD() {
            const items = document.querySelectorAll('.drag-item');
            const zone = document.getElementById('dropZone');
            if (!zone) return;

            items.forEach(item => {
                item.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', item.dataset.val);
                    item.classList.add('dragging');
                });
                item.addEventListener('dragend', () => item.classList.remove('dragging'));

                // Touch support
                let touchClone = null;
                item.addEventListener('touchstart', e => {
                    e.preventDefault();
                    touchClone = item.cloneNode(true);
                    touchClone.style.position = 'fixed';
                    touchClone.style.pointerEvents = 'none';
                    touchClone.style.zIndex = '9999';
                    touchClone.style.opacity = '0.8';
                    document.body.appendChild(touchClone);
                    item.classList.add('dragging');
                });
                item.addEventListener('touchmove', e => {
                    if (touchClone) {
                        const t = e.touches[0];
                        touchClone.style.left = (t.clientX - 40) + 'px';
                        touchClone.style.top = (t.clientY - 20) + 'px';
                    }
                });
                item.addEventListener('touchend', e => {
                    if (touchClone) {
                        touchClone.remove(); touchClone = null;
                        item.classList.remove('dragging');
                        const t = e.changedTouches[0];
                        const dropEl = document.elementFromPoint(t.clientX, t.clientY);
                        if (dropEl && (dropEl.id === 'dropZone' || dropEl.closest('#dropZone'))) {
                            handleDrop(item.dataset.val);
                        }
                    }
                });
            });

            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('over'));
            zone.addEventListener('drop', e => {
                e.preventDefault(); zone.classList.remove('over');
                handleDrop(e.dataTransfer.getData('text/plain'));
            });
        }

        function handleDrop(val) {
            const zone = document.getElementById('dropZone');
            const q = questions[currentQ];
            zone.textContent = val;
            if (val === q.correct) {
                zone.classList.add('correct');
                handleCorrect();
            } else {
                zone.classList.add('wrong');
                handleWrong(q.id);
                setTimeout(() => {
                    zone.classList.remove('wrong');
                    zone.textContent = 'Lepaskan jawaban di sini';
                }, 800);
            }
        }

function handleCorrect() {
            AudioManager.playCorrect();
            SpaceStore.registerCorrectAnswer();
            const timeBonus = 50; // simplified
            const xpEarned = SpaceStore.addXP(100, timeBonus);
            gameXP += xpEarned;
            score += xpEarned;
            document.getElementById('feedback').innerHTML = `<span class="fb-correct">✅ Benar! +${xpEarned} XP ${SpaceStore.get('isOnFire') ? '🔥' : ''}</span>`;
            updateComboUI();
            
            setTimeout(() => {
                currentQ++;
                if (currentQ >= questions.length) {

                    // SOUND APRESIASI
                    if (typeof AudioManager !== 'undefined' && AudioManager.playLevelUp) {
                        AudioManager.playLevelUp();
                    }

                    try {
                        SpaceStore.completeMission('mission2');
                        SpaceStore.addBadge('🌟');
                    } catch(e) { console.log(e); }

                    // TAMPILAN AKHIR YANG LEBIH KEREN
                    document.getElementById('gameArea').innerHTML = `
                        <style>
                            .result-panel-cool {
                                text-align: center;
                                padding: 40px 20px;
                                animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
                            }
                            .stars-container {
                                font-size: 3.5rem;
                                margin-bottom: 10px;
                                letter-spacing: 5px;
                                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
                                animation: starBounce 1s ease forwards;
                            }
                            .result-title {
                                font-size: 2.8rem;
                                font-weight: 900;
                                color: #ffffff;
                                text-shadow: 0 0 15px var(--plasma-cyan, #00e5ff), 0 0 30px var(--plasma-cyan, #00e5ff);
                                margin-bottom: 5px;
                                font-family: 'Baloo 2', sans-serif;
                            }
                            .result-subtitle {
                                font-size: 1.2rem;
                                color: #b0bec5;
                                margin-bottom: 30px;
                            }
                            .glow-score-box {
                                background: rgba(0, 0, 0, 0.3);
                                border: 2px solid var(--star-gold, #ffd700);
                                border-radius: 20px;
                                padding: 20px;
                                display: inline-block;
                                margin-bottom: 30px;
                                box-shadow: 0 0 20px rgba(255, 215, 0, 0.2) inset, 0 0 20px rgba(255, 215, 0, 0.4);
                                transform: scale(1);
                                transition: transform 0.3s ease;
                            }
                            .glow-score-box:hover {
                                transform: scale(1.05);
                            }
                            .score-label {
                                font-size: 1rem;
                                color: var(--star-gold, #ffd700);
                                text-transform: uppercase;
                                letter-spacing: 2px;
                                margin-bottom: 5px;
                            }
                            .score-number {
                                font-size: 4rem;
                                font-weight: 900;
                                color: white;
                                text-shadow: 0 0 10px rgba(255,255,255,0.8);
                                line-height: 1;
                            }
                            .btn-space {
                                background: linear-gradient(135deg, var(--plasma-cyan, #00e5ff), #0077ff);
                                color: white;
                                font-size: 1.3rem;
                                font-weight: 800;
                                font-family: 'Baloo 2', sans-serif;
                                padding: 16px 32px;
                                border: none;
                                border-radius: 50px;
                                cursor: pointer;
                                transition: all 0.3s ease;
                                box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4);
                            }
                            .btn-space:hover {
                                transform: translateY(-5px) scale(1.05);
                                box-shadow: 0 12px 30px rgba(0, 229, 255, 0.6);
                            }
                            
                            @keyframes popIn {
                                0% { transform: scale(0.8); opacity: 0; }
                                100% { transform: scale(1); opacity: 1; }
                            }
                            @keyframes starBounce {
                                0% { transform: translateY(-30px) scale(0.5); opacity: 0; }
                                50% { transform: translateY(10px) scale(1.2); }
                                100% { transform: translateY(0) scale(1); opacity: 1; }
                            }
                        </style>

                        <div class="result-panel-cool">
                            <div class="stars-container">⭐⭐⭐</div>
                            
                            <h1 class="result-title">MISI SELESAI! 🚀</h1>
                            <div class="result-subtitle">Kamu berhasil menaklukkan resep rahasia Galaksi Pecahan!</div>
                            
                            <div class="glow-score-box">
                                <div class="score-label">Total XP Terkumpul</div>
                                <div class="score-number">${score}</div>
                            </div>
                            
                            <br>
                            
                            <button class="btn-space" onclick="navigasiHalaman('dashboard.html')">
                                Kembali ke Markas 🛸
                            </button>
                        </div>
                    `;

                } else {
                    loadQuestion();
                }
            }, 1000);
        }        function handleWrong(qId) {
            AudioManager.playWrong();
            const attempts = SpaceStore.registerWrongAnswer(qId);
            score = Math.max(0, score - 20);
            document.getElementById('feedback').innerHTML = `<span class="fb-wrong">❌ Coba lagi! (-20 poin)</span>`;
            updateComboUI();
            if (attempts > 2) {
                const hintBtn = document.getElementById('hintBtn');
                if (hintBtn) hintBtn.classList.add('visible');
            }
        }

        function showHint() {
            const q = questions[currentQ];
            AudioManager.playClick();
            document.getElementById('feedback').innerHTML = `<span style="color:var(--star-gold)">🦜 ${q.hint}</span>`;
        }

        function updateComboUI() {
            const ci = document.getElementById('comboInd');
            const s = SpaceStore.get();
            if (ci) {
                ci.className = 'combo-indicator ' + (s.isOnFire ? 'fire' : 'normal');
                ci.textContent = s.isOnFire ? '🔥 COMBO x1.5!' : `Combo: ${s.comboCount}/3`;
            }
        }

        document.body.insertAdjacentHTML('beforeend', `
        <main class="page-container"><div class="glass-panel game-panel" id="gameArea">Memuat...</div></main>`);
        loadQuestion();
    </script>
</body>
